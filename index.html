<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pocket Blocks">
<meta name="theme-color" content="#b9b2a0">
<title>Pocket Blocks</title>
<link rel="icon" href="../icons/pocket-blocks-180.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/pocket-blocks-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --shell: #b9b2a0;
    --shell-light: #d3cdbd;
    --shell-dark: #8f8874;
    --shell-ink: #3a352c;
    --screen: #9caa7c;
    --screen-deep: #5c6b46;
    --ink: #2e3620;
    --accent: #b5432f;
    --accent-dark: #8a3122;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--shell);
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    color: var(--shell-ink);
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }

  .app {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }

  /* ---------- HUD (tap to pause) ---------- */
  .hud {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    align-items: stretch;
    cursor: pointer;
  }

  .panel {
    background: var(--screen);
    border-radius: 10px;
    padding: 6px 8px;
    box-shadow: inset 0 0 0 2px rgba(46, 54, 32, 0.12);
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .lbl {
    font-size: 9px;
    letter-spacing: 1.5px;
    font-weight: 600;
    color: var(--screen-deep);
  }

  .hold-panel { align-items: center; }

  .stats {
    position: relative;
    justify-content: center;
  }

  .stats .big {
    font-family: "Press Start 2P", monospace;
    font-size: 17px;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stats .mini {
    display: flex;
    gap: 12px;
    align-items: baseline;
  }

  .stats .mini b {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    font-weight: 400;
    color: var(--ink);
    margin-left: 4px;
  }

  .pause-hint {
    position: absolute;
    top: 6px;
    right: 8px;
    font-family: "Press Start 2P", monospace;
    font-size: 8px;
    color: var(--screen-deep);
    opacity: 0.7;
  }

  .next-panel { align-items: flex-start; }

  .next-row {
    display: flex;
    gap: 4px;
    align-items: flex-end;
  }

  canvas { display: block; }

  /* ---------- Playfield (gesture surface) ---------- */
  .play {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  .board-wrap {
    position: relative;
    background: var(--screen);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 0 0 4px var(--shell-dark), inset 0 3px 8px rgba(0, 0, 0, 0.16);
  }

  .board-wrap.shake { animation: shake 140ms ease-out; }

  @keyframes shake {
    0% { transform: translateY(0); }
    35% { transform: translateY(4px); }
    100% { transform: translateY(0); }
  }

  .popup {
    position: absolute;
    left: 0;
    right: 0;
    top: 34%;
    text-align: center;
    font-family: "Press Start 2P", monospace;
    font-size: 13px;
    line-height: 1.9;
    color: var(--ink);
    text-shadow: 0 2px 0 rgba(244, 248, 232, 0.75);
    opacity: 0;
    pointer-events: none;
  }

  .popup .pts { color: var(--accent-dark); font-size: 11px; }

  .popup.show { animation: pop 1.25s ease-out forwards; }

  @keyframes pop {
    0% { opacity: 0; transform: translateY(10px) scale(0.92); }
    14% { opacity: 1; transform: translateY(0) scale(1); }
    72% { opacity: 1; transform: translateY(-4px); }
    100% { opacity: 0; transform: translateY(-18px); }
  }

  /* ---------- Overlay menus ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    background: rgba(46, 54, 32, 0.9);
    color: var(--screen);
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow-y: auto;
    touch-action: pan-y;
  }

  .overlay[hidden] { display: none; }

  .card {
    width: min(340px, 100%);
    margin: auto 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    text-align: center;
  }

  .card h1 {
    font-family: "Press Start 2P", monospace;
    font-size: 24px;
    line-height: 1.5;
    margin: 0;
    font-weight: 400;
    text-wrap: balance;
  }

  .legend {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    font-size: 13px;
  }

  .legend li {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 2px;
    border-bottom: 1px dashed rgba(156, 170, 124, 0.25);
  }

  .legend b { font-weight: 600; }
  .legend span { opacity: 0.8; }

  .stat-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px 12px;
    font-size: 13px;
    text-align: left;
  }

  .stat-grid b {
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    font-weight: 400;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .new-best {
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    color: #f0c75e;
  }

  .note {
    margin: 0;
    font-size: 11px;
    line-height: 1.6;
    opacity: 0.7;
    max-width: 30ch;
  }

  .btns {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .btn {
    appearance: none;
    min-height: 50px;
    border-radius: 10px;
    font-family: "Press Start 2P", monospace;
    font-size: 12px;
    letter-spacing: 1px;
    cursor: pointer;
  }

  .btn.primary {
    border: none;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 3px 0 var(--accent-dark);
  }

  .btn.primary:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-dark); }

  .btn.ghost {
    background: transparent;
    color: var(--screen);
    border: 2px solid rgba(156, 170, 124, 0.45);
  }

  .btn.ghost:active { background: rgba(156, 170, 124, 0.15); }

  .btn:focus-visible { outline: 3px solid #f0c75e; outline-offset: 2px; }

  .btn:disabled { opacity: 0.6; }

  .link {
    appearance: none;
    background: none;
    border: none;
    padding: 4px;
    font: inherit;
    font-size: 12px;
    color: var(--screen);
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }

  /* Sign-in form */
  .form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field label {
    font-size: 10px;
    letter-spacing: 1.5px;
    font-weight: 600;
    opacity: 0.85;
  }

  .field input {
    appearance: none;
    width: 100%;
    min-height: 48px;
    border-radius: 10px;
    border: 2px solid rgba(156, 170, 124, 0.45);
    background: rgba(156, 170, 124, 0.1);
    color: #eef2e2;
    font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    font-size: 18px;
    padding: 8px 12px;
    user-select: text;
    -webkit-user-select: text;
    touch-action: manipulation;
  }

  .field input.pin { letter-spacing: 10px; font-size: 22px; }

  .field input:focus { outline: none; border-color: #f0c75e; }

  .error {
    margin: 0;
    min-height: 1.2em;
    font-size: 12px;
    line-height: 1.5;
    color: #f2a48f;
  }

  /* Player + leaderboard */
  .who {
    font-size: 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .who b {
    font-family: "Press Start 2P", monospace;
    font-size: 11px;
    font-weight: 400;
    color: #eef2e2;
  }

  .section-title {
    width: 100%;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    letter-spacing: 1px;
    text-align: left;
    opacity: 0.85;
  }

  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
    font-size: 12px;
  }

  .board-list li {
    display: grid;
    grid-template-columns: 2.2em 1fr auto;
    gap: 8px;
    align-items: baseline;
    padding: 7px 4px;
    border-bottom: 1px dashed rgba(156, 170, 124, 0.25);
    text-align: left;
  }

  .board-list li.me {
    background: rgba(240, 199, 94, 0.14);
    border-radius: 6px;
  }

  .board-list .rk { opacity: 0.7; font-variant-numeric: tabular-nums; }
  .board-list .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-list .nm small { opacity: 0.6; margin-left: 6px; }

  .board-list .sc {
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }

  .board-list .empty {
    display: block;
    text-align: center;
    opacity: 0.7;
    border: none;
  }

  details.help { width: 100%; text-align: left; }

  details.help summary {
    cursor: pointer;
    font-family: "Press Start 2P", monospace;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.85;
    padding: 4px 0 8px;
  }

  @media (prefers-reduced-motion: reduce) {
    .board-wrap.shake { animation: none; }
    .popup.show { animation-name: pop-fade; }
    @keyframes pop-fade { 0% { opacity: 0; } 14% { opacity: 1; } 72% { opacity: 1; } 100% { opacity: 0; } }
  }
</style>
</head>
<body>
<main class="app">
  <header class="hud" id="hud" aria-label="Tap to pause">
    <div class="panel hold-panel">
      <span class="lbl">HOLD</span>
      <canvas id="hold"></canvas>
    </div>
    <div class="panel stats">
      <span class="lbl">SCORE</span>
      <span class="big" id="score">0</span>
      <div class="mini">
        <span class="lbl">LV<b id="level">1</b></span>
        <span class="lbl">LINES<b id="lines">0</b></span>
      </div>
      <span class="pause-hint">II</span>
    </div>
    <div class="panel next-panel">
      <span class="lbl">NEXT</span>
      <div class="next-row">
        <canvas id="next0"></canvas>
        <canvas id="next1"></canvas>
        <canvas id="next2"></canvas>
      </div>
    </div>
  </header>

  <section class="play" id="play">
    <div class="board-wrap" id="boardWrap">
      <canvas id="board"></canvas>
      <div class="popup" id="popup" aria-live="polite"></div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay"></div>

<script>
(function () {
  "use strict";

  /* =========================================================
     Constants
     ========================================================= */
  var COLS = 10, ROWS = 22, HIDDEN = 2, VISIBLE = 20;
  var LOCK_MS = 500, MAX_RESETS = 15, CLEAR_MS = 320;
  var FLICK_V = 0.75; // px per ms
  var HOLD_SIZE = 52, NEXT_BIG = 52, NEXT_SMALL = 34;

  var COLORS = {
    I: "#4d7c8a", O: "#c99a3e", T: "#8a5a8c",
    S: "#5f8f5a", Z: "#b5432f", J: "#4d6a9a", L: "#c07a3e"
  };

  // SRS rotation states (spawn, R, 2, L)
  var SHAPES = {
    I: { size: 4, rotations: [
      ["....", "XXXX", "....", "...."],
      ["..X.", "..X.", "..X.", "..X."],
      ["....", "....", "XXXX", "...."],
      [".X..", ".X..", ".X..", ".X.."]
    ]},
    O: { size: 2, rotations: [["XX", "XX"], ["XX", "XX"], ["XX", "XX"], ["XX", "XX"]] },
    T: { size: 3, rotations: [
      [".X.", "XXX", "..."],
      [".X.", ".XX", ".X."],
      ["...", "XXX", ".X."],
      [".X.", "XX.", ".X."]
    ]},
    S: { size: 3, rotations: [
      [".XX", "XX.", "..."],
      [".X.", ".XX", "..X"],
      ["...", ".XX", "XX."],
      ["X..", "XX.", ".X."]
    ]},
    Z: { size: 3, rotations: [
      ["XX.", ".XX", "..."],
      ["..X", ".XX", ".X."],
      ["...", "XX.", ".XX"],
      [".X.", "XX.", "X.."]
    ]},
    J: { size: 3, rotations: [
      ["X..", "XXX", "..."],
      [".XX", ".X.", ".X."],
      ["...", "XXX", "..X"],
      [".X.", ".X.", "XX."]
    ]},
    L: { size: 3, rotations: [
      ["..X", "XXX", "..."],
      [".X.", ".X.", ".XX"],
      ["...", "XXX", "X.."],
      ["XX.", ".X.", ".X."]
    ]}
  };
  var TYPES = Object.keys(SHAPES);

  // SRS wall kicks, (x, y) with y pointing UP as in the guideline
  var KICKS_JLSTZ = {
    "0>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    "1>0": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    "1>2": [[0, 0], [1, 0], [1, -1], [0, 2], [1, 2]],
    "2>1": [[0, 0], [-1, 0], [-1, 1], [0, -2], [-1, -2]],
    "2>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]],
    "3>2": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    "3>0": [[0, 0], [-1, 0], [-1, -1], [0, 2], [-1, 2]],
    "0>3": [[0, 0], [1, 0], [1, 1], [0, -2], [1, -2]]
  };
  var KICKS_I = {
    "0>1": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    "1>0": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    "1>2": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]],
    "2>1": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    "2>3": [[0, 0], [2, 0], [-1, 0], [2, 1], [-1, -2]],
    "3>2": [[0, 0], [-2, 0], [1, 0], [-2, -1], [1, 2]],
    "3>0": [[0, 0], [1, 0], [-2, 0], [1, -2], [-2, 1]],
    "0>3": [[0, 0], [-1, 0], [2, 0], [-1, 2], [2, -1]]
  };

  var CELLS = {};
  TYPES.forEach(function (t) {
    CELLS[t] = SHAPES[t].rotations.map(function (grid) {
      var out = [];
      for (var y = 0; y < grid.length; y++)
        for (var x = 0; x < grid[y].length; x++)
          if (grid[y][x] === "X") out.push({ x: x, y: y });
      return out;
    });
  });

  /* =========================================================
     Storage
     ========================================================= */
  function load(k, d) {
    try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch (e) { return d; }
  }
  function save(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }

  var settings = { music: load("pb.music", true), sfx: load("pb.sfx", true) };
  var best = load("pb.best", 0);

  /* =========================================================
     Online profile + leaderboard
     ========================================================= */
  var API = "https://pocket-blocks-api.serge-herman-us.workers.dev/api";
  var profile = load("pb.profile", null);   // { name, token, player }
  var guest = false;
  var pending = load("pb.pending", []);     // scores that failed to upload
  var boardCache = null;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function api(path, opts) {
    opts = opts || {};
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
    var init = { method: opts.method || "GET", headers: {} };
    if (ctrl) init.signal = ctrl.signal;
    if (opts.body) {
      init.headers["Content-Type"] = "application/json";
      init.body = JSON.stringify(opts.body);
    }
    if (opts.token) init.headers["Authorization"] = "Bearer " + opts.token;
    return fetch(API + path, init).then(function (res) {
      if (timer) clearTimeout(timer);
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) {
          var err = new Error(data.error || "The server couldn't handle that. Try again.");
          err.status = res.status;
          throw err;
        }
        return data;
      });
    }, function () {
      if (timer) clearTimeout(timer);
      var err = new Error("Can't reach the leaderboard. Check your connection.");
      err.offline = true;
      throw err;
    });
  }

  function setProfile(p) {
    profile = p;
    save("pb.profile", p);
  }

  function signOut() {
    setProfile(null);
    guest = false;
  }

  function flushPending() {
    if (!profile || !pending.length) return;
    var item = pending[0];
    api("/score", { method: "POST", body: { token: profile.token, score: item.score, level: item.level, lines: item.lines } })
      .then(function (data) {
        pending.shift();
        save("pb.pending", pending);
        profile.player = data.player;
        setProfile(profile);
        flushPending();
      }, function (err) {
        if (err.status === 401) { pending = []; save("pb.pending", pending); }
      });
  }

  function refreshMe() {
    if (!profile) return Promise.resolve();
    return api("/me", { token: profile.token }).then(function (data) {
      profile.player = data.player;
      profile.rank = data.rank;
      setProfile(profile);
    }, function (err) {
      if (err.status === 401) signOut();
    });
  }

  function fetchBoard() {
    return api("/leaderboard?limit=10").then(function (data) {
      boardCache = data.players || [];
      return boardCache;
    });
  }

  function boardHtml(players, errorMsg) {
    if (errorMsg) return '<ol class="board-list"><li class="empty">' + esc(errorMsg) + "</li></ol>";
    if (!players) return '<ol class="board-list"><li class="empty">Loading…</li></ol>';
    if (!players.length) return '<ol class="board-list"><li class="empty">No scores yet. Be the first!</li></ol>';
    var mine = profile && profile.name ? profile.name.toLowerCase() : "";
    return '<ol class="board-list">' + players.map(function (p, i) {
      return '<li class="' + (p.name.toLowerCase() === mine ? "me" : "") + '">' +
        '<span class="rk">' + (i + 1) + ".</span>" +
        '<span class="nm">' + esc(p.name) + "<small>LV " + p.best_level + "</small></span>" +
        '<span class="sc">' + fmt(p.best_score) + "</span></li>";
    }).join("") + "</ol>";
  }

  function fillBoard(slotId) {
    var slot = document.getElementById(slotId);
    if (!slot) return;
    slot.innerHTML = boardHtml(boardCache);
    fetchBoard().then(function (players) {
      var s = document.getElementById(slotId);
      if (s) s.innerHTML = boardHtml(players);
    }, function (err) {
      var s = document.getElementById(slotId);
      if (s && !boardCache) s.innerHTML = boardHtml(null, err.message);
    });
  }

  /* =========================================================
     Elements
     ========================================================= */
  var $ = function (id) { return document.getElementById(id); };
  var hud = $("hud"), play = $("play"), boardWrap = $("boardWrap");
  var boardCanvas = $("board"), holdCanvas = $("hold");
  var nextCanvases = [$("next0"), $("next1"), $("next2")];
  var scoreEl = $("score"), levelEl = $("level"), linesEl = $("lines");
  var popupEl = $("popup"), overlay = $("overlay");

  function sizeCanvas(cv, w, h) {
    var dpr = window.devicePixelRatio || 1;
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv._ctx = cv.getContext("2d");
    cv._ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cv._w = w; cv._h = h;
  }

  /* =========================================================
     Game state
     ========================================================= */
  var state;

  function emptyRow() { return new Array(COLS).fill(null); }

  function newState() {
    var b = [];
    for (var y = 0; y < ROWS; y++) b.push(emptyRow());
    return {
      board: b, bag: [], queue: [], piece: null, hold: null, canHold: true,
      score: 0, lines: 0, level: 1, combo: -1, b2b: false,
      mode: "start", gravityAcc: 0, lockTimer: 0, lockResets: 0, lowestY: 0,
      lastAction: "", lastKick: 0, clearing: null, pendingPopup: null,
      cell: state ? state.cell : 24
    };
  }

  function refillQueue() {
    while (state.queue.length < 5) {
      if (state.bag.length === 0) {
        state.bag = TYPES.slice();

    return false;

    if (dist > 0) state.lastAction = "drop";

    void boardWrap.offsetWidth;
    boardWrap.classList.add("shake");

  }

  function rotate(dir) {
    var p = state.piece;

    var table = (p.type === "I" ? KICKS_I : KICKS_JLSTZ)[from + ">" + to];

    sndHold();
    drawPreviews();

  function isFilled(x, y) {

  }

    var p = state.piece;

    var cx = p.x + 1, cy = p.y + 1;
    var occ = [
      isFilled(cx - 1, cy - 1), isFilled(cx + 1, cy - 1),
      isFilled(cx + 1, cy + 1), isFilled(cx - 1, cy + 1)

    var allHidden = true;

      var x = p.x + cells[i].x, y = p.y + cells[i].y;

      spawnNext();

  }

  var NAMES = ["", "SINGLE", "DOUBLE", "TRIPLE", "TETRIS"];

  function applyScore(n, ts) {
    var base, label;
    if (ts === "full") {
      base = [400, 800, 1200, 1600][n];
      label = "T-SPIN" + (n ? " " + NAMES[n] : "");
    } else if (ts === "mini") {
      base = [100, 200, 400, 400][n];

    var lines = [];

      state.combo += 1;

      state.combo = -1;

    var points = base * state.level;
    if (state.combo > 0) points += 50 * state.combo * state.level;
    state.score += points;

    if (label) lines.unshift(label);
    if (state.combo > 0) lines.push("COMBO " + state.combo);
    if (points > 0) lines.push({ pts: "+" + fmt(points) });
    state.pendingPopup = lines.length && label ? lines : null;
  }

  function finishClear() {
    var rows = state.clearing.rows;
    state.clearing = null;
    var n = rows.length;
    state.board = state.board.filter(function (_, i) { return rows.indexOf(i) < 0; });
    while (state.board.length < ROWS) state.board.unshift(emptyRow());

    var lines = state.pendingPopup || [];

    var empty = state.board.every(function (r) { return r.every(function (c) { return !c; }); });
    if (empty) {

  }

  function gravityMs(level) {

  function update(dt) {
    if (state.mode !== "play") return;

    if (!state.piece) return;

    while (state.gravityAcc >= interval) {

      if (!fall()) { state.gravityAcc = 0; break; }

    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

    g.addColorStop(1, shade(color, -18));

    roundRect(ctx, px + pad, py + pad, w, w, cell * 0.16);
    ctx.fill();
    ctx.strokeStyle = shade(color, -38);
    ctx.lineWidth = Math.max(1, cell * 0.05);
    ctx.stroke();

    var pad = Math.max(1, cell * 0.1);

    ctx.strokeStyle = shade(color, -10);
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = Math.max(1, cell * 0.08);
    ctx.setLineDash([cell * 0.18, cell * 0.12]);

    ctx.stroke();

    if (!ctx) return;
    var c = state.cell, W = COLS * c, H = VISIBLE * c;

    ctx.fillStyle = "rgba(46, 54, 32, 0.16)";
    var dot = Math.max(1, c * 0.05);
    for (var y = 0; y < VISIBLE; y++) {
      for (var x = 0; x < COLS; x++) {

    var ctx = cv._ctx;

    var cells = CELLS[type][0];
    var minX = 9, maxX = -1, minY = 9, maxY = -1;
    cells.forEach(function (q) {
      minX = Math.min(minX, q.x); maxX = Math.max(maxX, q.x);
      minY = Math.min(minY, q.y); maxY = Math.max(maxY, q.y);

    cells.forEach(function (q) { drawBlock(ctx, ox + q.x * cell, oy + q.y * cell, cell, COLORS[type]); });

    drawPreview(holdCanvas, state.hold, !state.canHold);

  }

  function fmt(n) { return Number(n).toLocaleString("en-US"); }

  function updateHud() {

  }

  function showPopup(lines) {

  function resize() {

    state.cell = c;
    sizeCanvas(boardCanvas, c * COLS, c * VISIBLE);
    popupEl.style.fontSize = clamp(Math.round(c * 0.42), 10, 16) + "px";
    sizeCanvas(holdCanvas, HOLD_SIZE, HOLD_SIZE);
    sizeCanvas(nextCanvases[0], NEXT_BIG, NEXT_BIG);
    sizeCanvas(nextCanvases[1], NEXT_SMALL, NEXT_SMALL);
    sizeCanvas(nextCanvases[2], NEXT_SMALL, NEXT_SMALL);

  /* =========================================================

  var audioCtx = null, sfxGain = null, musicGain = null;

      musicGain = audioCtx.createGain();

      musicGain.gain.value = settings.music ? 1 : 0;

    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(dest);
    osc.start(t);
    osc.stop(t + dur + 0.03);

  function sndMove() { sfx(180, 0.04, "square", 0.09); }
  function sndRotate() { sfx(300, 0.03, "square", 0.1); sfx(440, 0.05, "square", 0.1, 0, 0.025); }
  function sndSoft() { sfx(140, 0.02, "square", 0.035); }
  function sndDrop() { sfx(220, 0.14, "square", 0.16, 55); }
  function sndLock() { sfx(120, 0.07, "triangle", 0.16); }
  function sndHold() { sfx(520, 0.09, "square", 0.09, 780); }

  var MELODY = [

    [69, 2], [69, 1], [72, 1], [76, 2], [74, 1], [72, 1],
    [71, 3], [72, 1], [74, 2], [76, 2],
    [72, 2], [69, 2], [69, 2], [0, 2],
    [74, 3], [77, 1], [81, 2], [79, 1], [77, 1],
    [76, 3], [72, 1], [76, 2], [74, 1], [72, 1],

    var bpm = 144 + Math.min(state.level - 1, 12) * 5;

  function gameOver() {

    var isBest = result.score > best;
    if (isBest) { best = result.score; save("pb.best", best); }
    var view = { result: result, localBest: isBest, status: profile ? "saving" : "guest" };
    setTimeout(function () { showGameOver(view); }, 450);

    if (!profile) return;
    api("/score", { method: "POST", body: { token: profile.token, score: result.score, level: result.level, lines: result.lines } })
      .then(function (data) {
        profile.player = data.player;
        profile.rank = data.rank;
        setProfile(profile);
        view.status = "saved";
        view.newBest = data.new_best;
        view.rank = data.rank;
      }, function (err) {
        if (err.status === 401) { signOut(); view.status = "signedout"; }
        else { pending.push(result); save("pb.pending", pending); view.status = "queued"; }

        '<form class="form" id="signin" novalidate>' +
          '<div class="field"><label for="pbName">NAME</label>' +
            '<input id="pbName" name="name" maxlength="16" autocomplete="nickname" autocapitalize="words" spellcheck="false" value="' + esc(prefill || "") + '"></div>' +
          '<div class="field"><label for="pbPin">4-DIGIT PIN</label>' +
            '<input id="pbPin" class="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"></div>' +
          '<p class="error" id="signinError" role="alert">' + esc(message || "") + "</p>" +
          '<div class="btns">' +
            '<button class="btn primary" type="submit" id="signinBtn">SIGN IN</button>' +
            '<button class="btn ghost" type="button" data-cmd="guest">PLAY WITHOUT SAVING</button>' +
          "</div>" +
        "</form>" +
      "</div>";
    overlay.hidden = false;

    var form = document.getElementById("signin");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var name = form.elements.name.value.trim();
      var pin = form.elements.pin.value.trim();
      var errEl = document.getElementById("signinError");
      if (name.length < 2) { errEl.textContent = "Enter a name with at least 2 characters."; return; }
      if (!/^\d{4}$/.test(pin)) { errEl.textContent = "The PIN must be exactly 4 digits."; return; }
      var btn = document.getElementById("signinBtn");
      btn.disabled = true;
      btn.textContent = "SIGNING IN…";
      errEl.textContent = "";
      api("/login", { method: "POST", body: { name: name, pin: pin } }).then(function (data) {
        setProfile({ name: data.player.name, token: data.token, player: data.player });
        guest = false;
        flushPending();
        showStart(data.created ? "Welcome, " + data.player.name + "! Your name is saved." : null);
      }, function (err) {
        btn.disabled = false;
        btn.textContent = "SIGN IN";
        errEl.textContent = err.message;
      });
    });
  }

  function showStart(welcome) {
    if (!profile && !guest) { showSignIn(); return; }
    var seenHelp = load("pb.seenHelp", false);
    var p = profile && profile.player;
    overlay.innerHTML =
      '<div class="card">' +
        "<h1>POCKET<br>BLOCKS</h1>" +
        (welcome ? '<p class="note">' + esc(welcome) + "</p>" : "") +
        '<div class="who">' +
          (profile
            ? "<span>Playing as</span><b>" + esc(profile.name) + "</b>"
            : "<span>Playing without saving</span>") +
          '<button class="link" data-cmd="switch">' + (profile ? "Switch" : "Sign in") + "</button>" +
        "</div>" +
        '<div class="btns"><button class="btn primary" data-cmd="start">START</button></div>' +
        (p
          ? '<div class="section-title">YOUR BESTS</div><div class="stat-grid" id="myStats">' + statsHtml(p, profile.rank) + "</div>"
          : (best > 0 ? '<div class="stat-grid"><span>Best on this phone</span><b>' + fmt(best) + "</b></div>" : "")) +
        '<div class="section-title">TOP 10</div>' +
        '<div id="startBoard" style="width:100%"></div>' +
        '<details class="help"' + (seenHelp ? "" : " open") + "><summary>HOW TO PLAY</summary>" + LEGEND + "</details>" +
        (IS_IOS && !navigator.standalone ? '<p class="note">For true full screen, tap Share, then Add to Home Screen.</p>' : "") +
      "</div>";
    overlay.hidden = false;
    fillBoard("startBoard");
    if (profile) {
      refreshMe().then(function () {
        var el = document.getElementById("myStats");
        if (el && profile && profile.player) el.innerHTML = statsHtml(profile.player, profile.rank);
        if (!profile && state.mode === "start") showSignIn("Your sign-in expired. Sign in again.");
      });
    }
  }

  function showPause() {
    overlay.innerHTML =
      '<div class="card">' +
        "<h1>PAUSED</h1>" +
        '<div class="btns">' +
          '<button class="btn primary" data-cmd="resume">RESUME</button>' +
          '<button class="btn ghost" data-cmd="leaderboard">LEADERBOARD</button>' +
          '<button class="btn ghost" data-cmd="music">MUSIC: ' + (settings.music ? "ON" : "OFF") + "</button>" +
          '<button class="btn ghost" data-cmd="sound">SOUND: ' + (settings.sfx ? "ON" : "OFF") + "</button>" +
          '<button class="btn ghost" data-cmd="restart">RESTART</button>' +
          '<button class="btn ghost" data-cmd="update">CHECK FOR UPDATE</button>' +
        "</div>" +
      "</div>";
    overlay.hidden = false;
  }

  function showLeaderboard() {
    overlay.innerHTML =
      '<div class="card">' +
        "<h1>TOP 10</h1>" +
        '<div id="pauseBoard" style="width:100%"></div>' +
        '<div class="btns"><button class="btn primary" data-cmd="backpause">BACK</button></div>' +
      "</div>";
    overlay.hidden = false;
    fillBoard("pauseBoard");
  }

  function showGameOver(view) {
    var r = view.result;
    var statusLine = {
      saving: "Saving your score…",
      saved: view.rank ? "Saved. Your best ranks #" + view.rank + " on the leaderboard." : "Score saved.",
      queued: "Couldn't reach the leaderboard. Your score will upload next time you're online.",
      signedout: "Your sign-in expired, so this score wasn't saved. Sign in again from the main menu.",
      guest: "Playing without saving. Sign in from the main menu to get on the leaderboard."
    }[view.status];
    var showNewBest = view.status === "saved" ? view.newBest : (view.status !== "saving" && view.localBest);
    overlay.innerHTML =
      '<div class="card">' +
        "<h1>GAME<br>OVER</h1>" +
        (showNewBest ? '<div class="new-best">NEW BEST!</div>' : "") +
        '<div class="stat-grid">' +
          "<span>Score</span><b>" + fmt(r.score) + "</b>" +
          "<span>Lines</span><b>" + r.lines + "</b>" +
          "<span>Level</span><b>" + r.level + "</b>" +
          (profile && profile.player
            ? "<span>Your best</span><b>" + fmt(profile.player.best_score) + "</b>"
            : "<span>Best on this phone</span><b>" + fmt(best) + "</b>") +
        "</div>" +
        '<p class="note">' + esc(statusLine) + "</p>" +
        '<div class="btns">' +
          '<button class="btn primary" data-cmd="start">PLAY AGAIN</button>' +
          '<button class="btn ghost" data-cmd="home">MAIN MENU</button>' +
        "</div>" +
        '<div class="section-title">TOP 10</div>' +
        '<div id="overBoard" style="width:100%"></div>' +
      "</div>";
    overlay.hidden = false;
    if (view.status === "saving") document.getElementById("overBoard").innerHTML = boardHtml(boardCache);
    else fillBoard("overBoard");
  }

  overlay.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-cmd]");
    if (!btn) return;
    ensureAudio();
    switch (btn.getAttribute("data-cmd")) {
      case "start": case "restart":
        save("pb.seenHelp", true);
        startGame(); break;
      case "resume": resume(); break;
      case "home": state.mode = "start"; showStart(); break;
      case "guest": guest = true; showStart(); break;
      case "switch": signOut(); showSignIn(); break;
      case "leaderboard": showLeaderboard(); break;
      case "backpause": showPause(); break;
      case "music":
        settings.music = !settings.music; save("pb.music", settings.music);
        if (musicGain) musicGain.gain.value = settings.music ? 1 : 0;
        showPause(); break;
      case "sound":
        settings.sfx = !settings.sfx; save("pb.sfx", settings.sfx);
        if (sfxGain) sfxGain.gain.value = settings.sfx ? 1 : 0;
        showPause(); break;
      case "update":
        window.location.href = window.location.pathname + "?t=" + Date.now(); break;
    }
  });

  hud.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    if (state.mode === "play") pause();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.hidden) pause();
  });

  /* =========================================================
     Gestures
     ========================================================= */
  var G = null, activePointers = {};
  function pointerCount() { return Object.keys(activePointers).length; }

  play.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    ensureAudio();
    activePointers[e.pointerId] = true;
    if (state.mode !== "play") return;
    var now = performance.now();
    if (pointerCount() === 1) {
      G = {
        id: e.pointerId, x0: e.clientX, y0: e.clientY, ax: e.clientX, ay: e.clientY,
        lx: e.clientX, ly: e.clientY, t0: now, lt: now, vy: 0,
        moved: false, max: 0, axis: null, two: false
      };
    } else if (G) {
      G.two = true;
    }
  });

  play.addEventListener("pointermove", function (e) {
    if (!G || G.two || e.pointerId !== G.id || state.mode !== "play") return;
    e.preventDefault();
    var now = performance.now(), x = e.clientX, y = e.clientY;
    var dt = Math.max(1, now - G.lt);
    G.vy = G.vy * 0.5 + ((y - G.ly) / dt) * 0.5;
    G.lx = x; G.ly = y; G.lt = now;

    var tx = x - G.x0, ty = y - G.y0;
    G.max = Math.max(G.max, Math.sqrt(tx * tx + ty * ty));
    if (!G.axis && G.max > 12) G.axis = Math.abs(tx) > Math.abs(ty) ? "h" : "v";

    var step = Math.max(16, state.cell * 0.85);
    var hStep = G.axis === "v" ? step * 1.5 : step;

    var dx = x - G.ax;
    while (dx >= hStep) { if (move(1)) sndMove(); G.ax += hStep; dx -= hStep; G.moved = true; }
    while (dx <= -hStep) { if (move(-1)) sndMove(); G.ax -= hStep; dx += hStep; G.moved = true; }

    if (y < G.ay) G.ay = y;
    var dy = y - G.ay;
    var allowSoft = G.axis === "v" || dy > step * 1.6;
    if (allowSoft && G.vy < FLICK_V) {
      while (dy >= step) { softDrop(); G.ay += step; dy -= step; G.moved = true; }
    }
  });

  function endPointer(e, cancelled) {
    delete activePointers[e.pointerId];
    if (!G || pointerCount() > 0) return;
    var g = G;
    G = null;
    if (cancelled || state.mode !== "play") return;

    var now = performance.now(), dt = now - g.t0;
    if (g.two) {
      if (dt < 450 && g.max < 24) rotate(-1);
      return;
    }

    var x = e.pointerId === g.id ? e.clientX : g.lx;
    var y = e.pointerId === g.id ? e.clientY : g.ly;
    var tx = x - g.x0, ty = y - g.y0;
    var v = now - g.lt > 90 ? 0 : g.vy;

    if (!g.moved && g.max < 14 && dt < 350) { rotate(1); return; }

    var remaining = y - g.ay;
    if (v > FLICK_V * 0.8 && remaining > Math.max(24, state.cell * 0.8) && Math.abs(ty) > Math.abs(tx) * 0.8) {
      hardDrop();
      return;
    }
    if (v < -FLICK_V * 0.6 && ty < -Math.max(30, state.cell) && Math.abs(ty) > Math.abs(tx) * 1.2) {
      hold();
    }
  }

  play.addEventListener("pointerup", function (e) { endPointer(e, false); });
  play.addEventListener("pointercancel", function (e) { endPointer(e, true); });

  document.addEventListener("touchmove", function (e) {
    if (!e.target.closest(".overlay")) e.preventDefault();
  }, { passive: false });

  /* Keyboard (desktop testing) */
  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "p" || k === "P" || k === "Escape") {
      if (state.mode === "play") pause(); else if (state.mode === "pause") resume();
      e.preventDefault();
      return;
    }
    if (state.mode !== "play") return;
    ensureAudio();
    switch (k) {
      case "ArrowLeft": if (move(-1)) sndMove(); break;
      case "ArrowRight": if (move(1)) sndMove(); break;
      case "ArrowDown": softDrop(); break;
      case "ArrowUp": case "x": case "X": rotate(1); break;
      case "z": case "Z": rotate(-1); break;
      case " ": hardDrop(); break;
      case "c": case "C": case "Shift": hold(); break;
      default: return;
    }
    e.preventDefault();
  });

  /* =========================================================
     Main loop
     ========================================================= */
  var lastFrame = performance.now();
  function frame(now) {
    var dt = Math.min(50, now - lastFrame);
    lastFrame = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 120); });

  state = newState();
  resize();
  showStart();
  flushPending();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
